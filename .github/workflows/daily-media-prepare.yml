name: TAK MEDIA Daily Prepare (approved Blog/Shorts, no external publish)

# 5-30: SCOUT/INTERVIEW/KNOWLEDGE 승인 -> TAK MEDIA 생성 -> ARCHIVE -> MEDIA
# Dashboard에서 사람이 이미 승인(review_status == "approved")한 콘텐츠를 매일
# 자동으로 "준비"만 한다: Blog Publishing Pack 생성 + Shorts ShortsScript JSON
# 저장 + Threads pending 현황 요약. scripts/prepare_approved_media.py(5-29,
# 이 workflow는 이 스크립트를 그대로 호출할 뿐 새 로직을 추가하지 않는다)를
# 그대로 재사용한다.
#
# 중요(반드시 지켜야 하는 경계 - docs/5-30_operational_automation.md 4장 결정 B):
# "prepare"(이 workflow)와 "publish"(daily-threads-post.yml,
# publish-approved-threads.yml, youtube-shorts-upload.yml)는 명확히 분리된다.
# 이 workflow는 다음을 절대 하지 않는다:
#   - Threads 실제 게시 (scripts/publish_threads.py, publish_approved_threads.py,
#     content_engine/threads_publisher.py를 전혀 import/실행하지 않는다)
#   - YouTube 업로드 (scripts/upload_youtube_short.py, content_engine/
#     youtube_publisher.py를 전혀 import/실행하지 않는다)
#   - Naver 게시 (애초에 이 저장소에 Naver 게시 자동화 코드 자체가 없다)
#   - LLM 호출 (content_engine/llm_provider.py를 전혀 import/실행하지 않는다 -
#     scripts/generate_blog_publish_pack.py --from-archive와
#     scripts/generate_approved_shorts_script.py 둘 다 이미 archive에 저장된
#     결과만 읽는다)
# 그래서 이 workflow는 THREADS_ACCESS_TOKEN, TAK_MEDIA_LLM_*, YOUTUBE_* 등
# 어떤 Secrets도 필요로 하지 않는다 - env 블록 자체가 없다.
#
# GitHub Actions 러너는 매 실행마다 새로 checkout하므로, 사람이 로컬(또는
# Codespace)에서 MEDIA Dashboard로 승인한 data/tak_media_archive.json이
# git에 커밋/푸시되어 있어야만 이 workflow가 그 승인 상태를 볼 수 있다
# (data/tak_threads_pending.json에 이미 적용되어 있던 것과 동일한 원칙 -
# 5-30에서 .gitignore에 !data/tak_media_archive.json을 추가해 커밋 가능하게
# 했다). 이 workflow 자체는 archive를 읽기만 하고 절대 쓰지 않는다.
#
# 자기 자신을 무한 재실행시키는 구조가 아님(5-30 조사 결과, 이 저장소의
# 어떤 workflow도 on: push 트리거를 쓰지 않는다 - schedule/workflow_dispatch
# 뿐이므로, 이 workflow의 git push가 어떤 workflow도 재트리거하지 않는다.
# 게다가 기본 GITHUB_TOKEN으로 만든 push는 GitHub Actions 자체 정책상
# 다른 workflow의 트리거가 되지 않는 이중 안전장치도 있다).
#
# 한국시간(KST, UTC+9) 매일 오전 8시 30분에 실행한다. 기존 daily-scout.yml이
# 이미 '0 23 * * *'(UTC, KST 08:00)에 실행 중이므로, 두 workflow의 checkout/
# 테스트/커밋이 겹치지 않도록 30분 뒤로 지정한다.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 준비 작업은 실행하되 git commit/push는 하지 않습니다(결과만 확인)"
        required: true
        default: false
        type: boolean
      blog_max:
        description: "오늘 Blog Publishing Pack 후보 최대 개수(비우면 기본값 사용)"
        required: false
        default: ""
        type: string

# data/shorts_scripts/*.json을 이 workflow가 직접 commit/push해야 하므로
# 저장소 쓰기 권한이 필요하다. 그 외 권한은 기본값(read)으로 최소화한다.
permissions:
  contents: write

# 동일 workflow가 동시에 두 번 실행되면 같은 content_id를 동시에 준비하려
# 들거나 commit이 경합할 수 있으므로, 기존 daily-scout.yml 등과 동일하게
# 취소 대신 대기(큐)시킨다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare approved Blog Pack + Shorts Script (read-only Threads summary, no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Show Python version
        run: python3 --version

      # 테스트가 실패하면 이후 단계(준비 작업, commit 스텝)로 진행하지 않는다
      # (기존 daily-scout.yml/daily-threads-post.yml 등과 동일한 안전장치).
      - name: Run existing test suite
        run: python3 -m unittest discover -s tests -p 'test*.py'

      # scripts/prepare_approved_media.py 하나가 Blog Pack 생성 + Shorts
      # ShortsScript 저장 + Threads pending 현황 요약까지 전부 수행한다(내부
      # 로직은 이 workflow에서 수정하지 않음). Secrets를 하나도 넘기지 않는다 -
      # 이 스크립트가 호출하는 두 하위 CLI 모두 LLM/외부 API를 호출하지 않는다.
      - name: Run prepare_approved_media.py (Blog Pack + Shorts Script + Threads summary)
        env:
          BLOG_MAX: ${{ github.event.inputs.blog_max }}
        run: |
          if [ -n "$BLOG_MAX" ]; then
            python3 scripts/prepare_approved_media.py --blog-max "$BLOG_MAX"
          else
            python3 scripts/prepare_approved_media.py
          fi

      # Blog Publishing Pack은 기존 정책(data/blog_publish_pack_daily.md는
      # 매 실행마다 새로 생성되는 휘발성 결과물, git에 커밋하지 않음)을 그대로
      # 존중한다 - 대신 워크플로우 아티팩트로 남겨 사람이 다운로드해서 확인할
      # 수 있게 한다.
      - name: Upload Blog Publishing Pack as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-publish-pack-daily
          path: data/blog_publish_pack_daily.md
          if-no-files-found: ignore
          retention-days: 14

      # data/shorts_scripts/<content_id>.json은 Blog Pack과 달리 한 번
      # 생성되면 고정되는 영구 산출물이다(5-29: "이미 생성된 경우에는 중복
      # 생성하지 않는다") - 이 "이미 생성됨" 판단이 다음 실행(새 checkout)에서도
      # 유효하려면 git에 커밋되어 있어야 한다. dry_run이면 이 스텝 자체를
      # 건너뛴다(준비 결과는 위 스텝 로그와 아티팩트로 이미 확인 가능).
      - name: Check for new/changed Shorts scripts
        id: shorts_diff
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false'
        run: |
          mkdir -p data/shorts_scripts
          git add data/shorts_scripts
          if git diff --cached --quiet -- data/shorts_scripts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 변경된(=새로 생성된) Shorts script가 있을 때만 commit/push한다. 아무
      # 것도 새로 준비되지 않았으면(승인된 Shorts가 없거나 전부 이미 생성된
      # 경우) 이 스텝은 조건이 거짓이 되어 자연히 건너뛰어지고, workflow는
      # "커밋할 변경 없음" 상태로 정상 종료한다(빈 commit을 만들지 않는다).
      - name: Commit and push newly prepared Shorts scripts
        if: |
          (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false') &&
          steps.shorts_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: prepare approved Shorts scripts"
          git push
