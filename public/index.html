<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티몽의 지혜</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", Arial, sans-serif;
      line-height: 1.6;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
      color: #1c1c1e;
      background: #ffffff;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.25rem;
    }
    p.lead {
      color: #4b5563;
      margin-top: 0;
    }
    ul {
      padding-left: 1.25rem;
    }
    li {
      margin-bottom: 0.5rem;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: #6b7280;
    }
    footer a {
      color: inherit;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111114; color: #f4f4f5; }
      p.lead { color: #a1a1aa; }
      footer { border-top-color: #27272a; color: #a1a1aa; }
    }
  </style>
</head>
<body>
  <h1>티몽의 지혜</h1>
  <p class="lead">AI를 활용해 콘텐츠를 만들고 관리하는 개인 콘텐츠 자동화 프로젝트입니다.</p>

  <ul>
    <li>콘텐츠 기획</li>
    <li>정보 및 지식 정리</li>
    <li>YouTube Shorts 콘텐츠 제작</li>
    <li>콘텐츠 자동 게시 및 관리</li>
  </ul>

  <footer>
    <p><a href="/privacy">개인정보처리방침</a></p>
  </footer>
</body>
</html>
