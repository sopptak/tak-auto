services:
  - type: web
    name: tak-auto-mvp
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q scripts content_engine tak_scout tak_brain
    startCommand: >-
      mkdir -p /var/data &&
      if [ -d data ] && [ ! -L data ]; then cp -an data/. /var/data/; rm -rf data; fi &&
      ln -sfn /var/data data &&
      python scripts/start_tak_auto_mvp.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /trends
    disk:
      name: tak-auto-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TAK_WEB_USERNAME
        sync: false
      - key: TAK_WEB_PASSWORD
        sync: false
      - key: TAK_SCOUT_PERPLEXITY_API_KEY
        sync: false
      - key: TAK_MEDIA_LLM_API_KEY
        sync: false
      - key: TAK_MEDIA_LLM_ENDPOINT
        sync: false
      - key: TAK_MEDIA_LLM_MODEL
        sync: false
