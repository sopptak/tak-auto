services:
  - type: web
    name: tak-auto-mvp
    runtime: python
    plan: starter
    buildCommand: apt-get update && apt-get install -y fonts-noto-cjk ffmpeg && python -m compileall -q scripts content_engine tak_scout tak_brain
    startCommand: >-
      mkdir -p /var/data &&
      if [ -d data ] && [ ! -L data ]; then cp -an data/. /var/data/; rm -rf data; fi &&
      ln -sfn /var/data data &&
      if [ -s data/tak_auto_trend_daily.json ]; then
        python scripts/start_tak_auto_mvp.py --skip-collect --host 0.0.0.0 --port $PORT;
      else
        python scripts/start_tak_auto_mvp.py --host 0.0.0.0 --port $PORT;
      fi
    healthCheckPath: /health
    disk:
      name: tak-auto-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TAK_DISABLE_MONEY_SCOUT_AGENT
        value: true
      - key: TAK_WEB_LANDING_PATH
        value: /trends
      - key: TAK_WEB_USERNAME
        sync: false
      - key: TAK_WEB_PASSWORD
        sync: false
      - key: TAK_SCOUT_PERPLEXITY_API_KEY
        sync: false
      - key: NAVER_DATALAB_CLIENT_ID
        sync: false
      - key: NAVER_DATALAB_CLIENT_SECRET
        sync: false
      - key: TAK_MEDIA_LLM_API_KEY
        sync: false
      - key: TAK_MEDIA_LLM_ENDPOINT
        sync: false
      - key: TAK_MEDIA_LLM_MODEL
        sync: false

  - type: web
    name: tak-auto-trend-factory
    runtime: python
    plan: starter
    buildCommand: apt-get update && apt-get install -y fonts-noto-cjk && python -m pip install --disable-pip-version-check -r requirements.txt && python -m compileall -q scripts content_engine tak_scout tak_brain blog_importer
    startCommand: python scripts/run_trend_content_mvp.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tak-auto-trend-factory-data
      mountPath: /var/data/trend-factory
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TAK_AUTO_DATA_DIR
        value: /var/data/trend-factory
      - key: TAK_AUTO_PUBLISHING_ENABLED
        value: false
      - key: TAK_AUTO_PUBLISHER
        value: content_engine.trend_publishers:publish
      - key: TAK_AUTO_PUBLIC_URL
        value: https://tak-auto-trend-factory.onrender.com
      - key: TAK_AUTO_OAUTH_ENCRYPTION_KEY
        sync: false
      - key: TAK_AUTO_MEDIA_SIGNING_KEY
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: NAVER_LOGIN_CLIENT_ID
        sync: false
      - key: NAVER_LOGIN_CLIENT_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v27.0
      - key: TAK_WEB_USERNAME
        sync: false
      - key: TAK_WEB_PASSWORD
        sync: false
      - key: TAK_SCOUT_PERPLEXITY_API_KEY
        sync: false
